name: Update Data

on:
    schedule:
        - cron: '0 0 * * *'
    workflow_dispatch:

jobs:
    build-and-update:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: リポジトリをチェックアウト
              uses: actions/checkout@v4

            - name: Pythonをセットアップ
              uses: actions/setup-python@v5
              with:
                python-version: '3.10'

            - name: ライブラリをインストール
              run: |
                python -m pip install --upgrade pip
                pip install requests

            - name: スクレイピングを実行
              run: python update.py

            - name: 更新されたデータをコミットしてPush
              run: |
                git config --local user.email "action@github.com"
                git config --local user.name "GitHub Action"
                git add sounds.json
                git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update plugins data" && git push)